<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <!-- App-like chrome on phones: navy status bar, safe-area aware layout. -->
    <meta name="theme-color" content="#0a1c33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Opening splash: painted with the first HTML byte, before the JS bundle loads. */
      #ge-boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(70% 50% at 50% 40%, #15325a 0%, #0a1c33 70%);
        transition: opacity 420ms ease, visibility 0s linear 420ms;
      }
      #ge-boot[data-done] {
        opacity: 0;
        visibility: hidden;
      }
      #ge-boot .mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        animation: ge-boot-in 760ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      #ge-boot img {
        width: 230px;
        height: auto;
      }
      #ge-boot .bar {
        width: 72px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #ge-boot .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #c8102e;
        animation: ge-boot-bar 1.1s ease-in-out infinite;
      }
      @keyframes ge-boot-in {
        from { opacity: 0; transform: scale(0.95); filter: blur(5px); }
        to { opacity: 1; transform: none; filter: none; }
      }
      @keyframes ge-boot-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #ge-boot, #ge-boot .mark, #ge-boot .bar::after { animation: none; transition: none; }
      }
    </style>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="ge-boot" role="presentation">
      <div class="mark">
        <img src="/images/great-empower-horizontal-white.png" alt="GREAT EMPOWER" width="230" />
        <span class="bar"></span>
      </div>
    </div>
    <script>
      // Show the opening once per session only; internal navigation never re-triggers it.
      try {
        if (sessionStorage.getItem("ge-splash-seen") === "1") {
          document.getElementById("ge-boot").remove();
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
